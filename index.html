<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦌 BailuStoryMaker - AI 辅助小说编写工具</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/ai-assistant.css">
    <link rel="stylesheet" href="css/timeline.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🦌 BailuStoryMaker</h1>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="story">
                    <span>📖</span> <span data-i18n="nav.story">故事</span>
                </button>
                <button class="nav-item" data-view="elements">
                    <span>🎭</span> <span data-i18n="nav.elements">故事元素</span>
                </button>
                <button class="nav-item" data-view="prompt">
                    <span>✨</span> <span data-i18n="nav.prompt">提示词</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button id="new-story-btn" class="btn btn-primary" data-i18n="buttons.newStory">新建故事</button>
                <select id="lang-selector" class="lang-selector">
                    <option value="zh-CN" data-i18n="language.zhCN">简体中文</option>
                    <option value="en-US" data-i18n="language.enUS">English</option>
                </select>
                <div id="save-status" class="save-status"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h2 id="story-title" data-i18n="header.noStoryLoaded">未加载故事</h2>
                </div>
                <div class="header-right">
                    <button id="undo-btn" class="btn btn-secondary" disabled data-i18n="buttons.undo">↩ 撤销</button>
                    <button id="redo-btn" class="btn btn-secondary" disabled data-i18n="buttons.redo">↪ 重做</button>
                    <button id="export-btn" class="btn btn-secondary" data-i18n="buttons.export">导出</button>
                    <input type="file" id="import-input" accept=".json" style="display: none;">
                    <button id="import-btn" class="btn btn-secondary" data-i18n="buttons.import">导入</button>
                    <button id="theme-toggle" class="btn btn-secondary">🌙</button>
                </div>
            </header>

            <!-- Views -->
            <div id="views-container">
                <!-- Story View -->
                <div id="story-view" class="view active">
                    <div class="story-container">
                        <div class="chapter-list">
                            <h3 data-i18n="story.chapters">章节</h3>
                            <button id="add-chapter-btn" class="btn btn-sm" data-i18n="buttons.addChapter">+ 添加章节</button>
                            <div id="chapters" class="chapters-list"></div>
                        </div>
                        <div class="chapter-editor" id="chapter-editor-panel">
                            <div id="chapter-editor-placeholder" class="editor-placeholder active">
                                <div class="placeholder-content">
                                    <div class="placeholder-icon">📝</div>
                                    <p data-i18n="placeholder.chapter">请从左侧选择一个章节或创建新章节</p>
                                </div>
                            </div>
                            <div id="chapter-editor-content" class="chapter-editor-content hidden">
                                <div class="editor-header">
                                    <input type="text" id="chapter-title" class="input-field" data-i18n-placeholder="story.chapterTitle" placeholder="章节标题">
                                    <button id="show-ai-panel-btn" class="btn btn-sm" title="显示AI助手">🤖</button>
                                </div>
                                <div class="view-location-selector">
                                    <label data-i18n="story.viewLocation">当前视角位置:</label>
                                    <select id="view-location-select" class="input-field">
                                        <option value="" data-i18n="story.viewLocationAny">全知视角</option>
                                    </select>
                                    <div id="present-elements-indicator" class="present-elements-indicator">
                                        <span data-i18n="story.presentElements">在场元素: </span>
                                        <span id="present-elements-count">0</span>
                                    </div>
                                </div>
                                <div class="paragraphs-container">
                                    <div id="paragraphs-list" class="paragraphs-list"></div>
                                    <div class="paragraph-input-area">
                                        <textarea id="new-paragraph-input" class="input-field" placeholder="输入段落内容，按 Enter 添加..." rows="2"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- AI Assistant Panel -->
                        <aside class="ai-assistant-panel" id="ai-assistant-panel" hidden>
                            <!-- Collapsed Mode - External Buttons -->
                            <div class="ai-panel-collapsed-actions" id="ai-panel-collapsed-actions">
                                <button class="ai-panel-button ai-expand-btn" id="ai-expand-button" title="展开">◀</button>
                                <button class="ai-panel-button" id="ai-collapsed-settings-button" title="设置">⚙️</button>
                            </div>
                            <div class="ai-panel-header" id="ai-panel-header">
                                <div class="ai-panel-title">
                                    <span>🤖</span> <span data-i18n="ai.title">AI助手</span>
                                </div>
                                <div class="ai-panel-actions">
                                    <button class="ai-panel-button ai-expand-btn hidden" id="ai-expand-button-header" title="展开">◀</button>
                                    <button class="ai-panel-button ai-collapse-btn" id="ai-collapse-button" title="折叠">▶</button>
                                    <button class="ai-panel-button" id="ai-settings-button" title="设置">⚙️</button>
                                    <button class="ai-panel-button" id="ai-clear-history" title="清空历史">🗑️</button>
                                </div>
                            </div>
                            <div class="ai-panel-content" id="ai-panel-content">
                                <div class="ai-chat-area" id="ai-chat-area">
                                    <!-- Chat messages will be rendered here -->
                                </div>
                                <div class="ai-input-area">
                                    <textarea id="ai-input" placeholder="输入消息... (Shift+Enter换行, Enter发送)" rows="3"></textarea>
                                    <div class="ai-input-footer">
                                        <button id="ai-send-button" data-i18n="ai.send">发送</button>
                                        <span id="ai-character-counter">0/4000</span>
                                    </div>
                                </div>
                            </div>
                            <div class="ai-loading-indicator hidden" id="ai-loading-indicator">
                                <span class="ai-loading-dots">AI正在思考</span>
                            </div>
                            <div class="ai-resize-handle" id="ai-resize-handle"></div>
                        </aside>
                        <div class="changes-tracker" id="changes-tracker">
                            <h4 data-i18n="story.changesTracker">修改追踪</h4>
                            <div id="changes-content" class="changes-content"></div>
                        </div>
                    </div>
                </div>

                <!-- Story Elements View -->
                <div id="elements-view" class="view">
                    <div class="elements-container">
                        <div class="elements-tabs">
                            <button class="tab-btn active" data-tab="all" data-i18n="elements.allTab">全部</button>
                            <button class="tab-btn" data-tab="characters" data-i18n="elements.charactersTab">角色</button>
                            <button class="tab-btn" data-tab="items" data-i18n="elements.itemsTab">道具</button>
                            <button class="tab-btn" data-tab="settings" data-i18n="elements.settingsTab">设定</button>
                        </div>
                        <div class="elements-content">
                            <!-- All Elements Tab -->
                            <div id="all-tab" class="elements-tab-content active">
                                <div class="elements-list">
                                    <h3 data-i18n="elements.allList">全部元素</h3>
                                    <button id="add-element-btn" class="btn btn-sm" data-i18n="buttons.addElement">+ 添加元素</button>
                                    <div id="all-elements" class="elements-list-container"></div>
                                </div>
                                <div class="element-editor" id="element-editor-panel">
                                    <div id="element-editor-placeholder" class="editor-placeholder active">
                                        <div class="placeholder-content">
                                            <div class="placeholder-icon">📦</div>
                                            <p data-i18n="placeholder.element">请从左侧选择一个元素或创建新元素</p>
                                        </div>
                                    </div>
                                    <div id="element-editor-content" class="element-editor-content hidden">
                                        <h3 data-i18n="element.details">元素详情</h3>
                                        <form id="element-form" class="editor-form">
                                            <select id="element-type" class="input-field">
                                                <option value="character" data-i18n="element.typeCharacter">人物</option>
                                                <option value="item" data-i18n="element.typeItem">道具</option>
                                                <option value="location" data-i18n="element.typeLocation">地点</option>
                                                <option value="memory" data-i18n="element.typeMemory">记忆</option>
                                                <option value="base" data-i18n="element.typeBase">基础设定</option>
                                            </select>
                                            <input type="text" id="element-name" class="input-field" data-i18n-placeholder="element.name" placeholder="元素名称">
                                            <textarea id="element-description" class="input-field" data-i18n-placeholder="element.description" placeholder="元素描述"></textarea>
                                            <textarea id="element-keywords" class="input-field" data-i18n-placeholder="element.keywords" placeholder="关键词（逗号分隔）"></textarea>
                                            <button type="submit" class="btn btn-primary" data-i18n="buttons.saveElement">保存元素</button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- Characters Tab -->
                            <div id="characters-tab" class="elements-tab-content">
                                <div class="elements-list">
                                    <h3 data-i18n="elements.charactersList">角色列表</h3>
                                    <button id="add-character-btn" class="btn btn-sm" data-i18n="buttons.addCharacter">+ 添加角色</button>
                                    <div id="characters" class="elements-list-container"></div>
                                </div>
                                <div class="element-editor" id="character-editor-panel">
                                    <div id="character-editor-placeholder" class="editor-placeholder active">
                                        <div class="placeholder-content">
                                            <div class="placeholder-icon">👤</div>
                                            <p data-i18n="placeholder.character">请从左侧选择一个角色或创建新角色</p>
                                        </div>
                                    </div>
                                    <div id="character-editor-content" class="element-editor-content hidden">
                                        <h3 data-i18n="character.details">角色详情</h3>
                                        <form id="character-form" class="editor-form">
                                            <input type="text" id="char-name" class="input-field" data-i18n-placeholder="character.name" placeholder="角色名称">
                                            <textarea id="char-description" class="input-field" data-i18n-placeholder="character.description" placeholder="角色描述"></textarea>
                                            <div class="attributes-section">
                                                <h4 data-i18n="character.attributes">属性</h4>
                                                <div id="char-attributes"></div>
                                                <button type="button" id="add-attr-btn" class="btn btn-sm" data-i18n="character.addAttribute">+ 添加属性</button>
                                            </div>
                                            <div class="abilities-section">
                                                <h4 data-i18n="character.abilities">能力</h4>
                                                <div id="char-abilities"></div>
                                                <button type="button" id="add-ability-btn" class="btn btn-sm" data-i18n="character.addAbility">+ 添加能力</button>
                                            </div>
                                            <textarea id="char-notes" class="input-field" data-i18n-placeholder="character.notes" placeholder="备注"></textarea>
                                            <button type="submit" class="btn btn-primary" data-i18n="buttons.saveCharacter">保存角色</button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- Items Tab -->
                            <div id="items-tab" class="elements-tab-content">
                                <div class="elements-list">
                                    <h3 data-i18n="elements.itemsList">道具列表</h3>
                                    <button id="add-item-btn" class="btn btn-sm" data-i18n="buttons.addItem">+ 添加道具</button>
                                    <div id="items" class="elements-list-container"></div>
                                </div>
                                <div class="element-editor" id="item-editor-panel">
                                    <div id="item-editor-placeholder" class="editor-placeholder active">
                                        <div class="placeholder-content">
                                            <div class="placeholder-icon">🎒</div>
                                            <p data-i18n="placeholder.item">请从左侧选择一个道具或创建新道具</p>
                                        </div>
                                    </div>
                                    <div id="item-editor-content" class="element-editor-content hidden">
                                        <h3 data-i18n="item.details">道具详情</h3>
                                        <form id="item-form" class="editor-form">
                                            <input type="text" id="item-name" class="input-field" data-i18n-placeholder="item.name" placeholder="道具名称">
                                            <select id="item-type" class="input-field">
                                                <option value="other" data-i18n="item.typeOther">其他</option>
                                                <option value="weapon" data-i18n="item.typeWeapon">武器</option>
                                                <option value="armor" data-i18n="item.typeArmor">护甲</option>
                                                <option value="tool" data-i18n="item.typeTool">工具</option>
                                                <option value="quest" data-i18n="item.typeQuest">任务物品</option>
                                            </select>
                                            <textarea id="item-description" class="input-field" data-i18n-placeholder="item.description" placeholder="道具描述"></textarea>
                                            <div class="properties-section">
                                                <h4 data-i18n="item.properties">属性</h4>
                                                <div id="item-properties"></div>
                                                <button type="button" id="add-prop-btn" class="btn btn-sm" data-i18n="item.addProperty">+ 添加属性</button>
                                            </div>
                                            <button type="submit" class="btn btn-primary" data-i18n="buttons.saveItem">保存道具</button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- Settings Tab -->
                            <div id="settings-tab" class="elements-tab-content">
                                <div class="elements-list">
                                    <h3 data-i18n="elements.settingsList">设定列表</h3>
                                    <button id="add-setting-btn" class="btn btn-sm" data-i18n="buttons.addSetting">+ 添加设定</button>
                                    <div id="settings" class="elements-list-container"></div>
                                </div>
                                <div class="element-editor" id="setting-editor-panel">
                                    <div id="setting-editor-placeholder" class="editor-placeholder active">
                                        <div class="placeholder-content">
                                            <div class="placeholder-icon">🏰</div>
                                            <p data-i18n="placeholder.setting">请从左侧选择一个设定或创建新设定</p>
                                        </div>
                                    </div>
                                    <div id="setting-editor-content" class="element-editor-content hidden">
                                        <h3 data-i18n="setting.details">设定详情</h3>
                                        <form id="setting-form" class="editor-form">
                                            <input type="text" id="setting-name" class="input-field" data-i18n-placeholder="setting.name" placeholder="设定名称">
                                            <select id="setting-type" class="input-field">
                                                <option value="location" data-i18n="setting.typeLocation">地点</option>
                                                <option value="region" data-i18n="setting.typeRegion">区域</option>
                                                <option value="world" data-i18n="setting.typeWorld">世界</option>
                                            </select>
                                            <select id="setting-parent" class="input-field">
                                                <option value="" data-i18n="setting.noParent">无父级</option>
                                            </select>
                                            <textarea id="setting-description" class="input-field" data-i18n-placeholder="setting.description" placeholder="设定描述"></textarea>
                                            <button type="submit" class="btn btn-primary" data-i18n="buttons.saveSetting">保存设定</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Prompt View -->
                <div id="prompt-view" class="view">
                    <div class="prompt-container">
                        <div class="prompt-controls">
                            <h3 data-i18n="prompt.title">提示词生成</h3>
                            <label>
                                <span data-i18n="prompt.selectChapter">选择章节:</span>
                                <select id="prompt-chapter" class="input-field"></select>
                            </label>
                            <label>
                                <span data-i18n="prompt.template">模板:</span>
                                <select id="prompt-template" class="input-field">
                                    <option value="default" data-i18n="prompt.templateDefault">默认模板</option>
                                    <option value="character-focus" data-i18n="prompt.templateCharacter">角色聚焦</option>
                                    <option value="scene-setup" data-i18n="prompt.templateScene">场景设定</option>
                                </select>
                            </label>
                            <button id="generate-prompt-btn" class="btn btn-primary" data-i18n="buttons.generatePrompt">生成提示词</button>
                        </div>
                        <div class="prompt-preview">
                            <h4 data-i18n="prompt.generated">生成的提示词</h4>
                            <textarea id="generated-prompt" class="prompt-output" readonly></textarea>
                            <button id="copy-prompt-btn" class="btn btn-secondary" data-i18n="buttons.copyPrompt">复制到剪贴板</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- AI Assistant Mobile Elements -->
    <button id="ai-mobile-button" class="hidden">🤖</button>
    <div id="ai-drawer-backdrop" class="hidden"></div>

    <!-- Modal for new story -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modal-title" data-i18n="modal.newStory">新建故事</h3>
            <form id="modal-form">
                <input type="text" id="modal-input" class="input-field" data-i18n-placeholder="placeholder.inputName" placeholder="输入名称" required>
                <button type="submit" class="btn btn-primary" data-i18n="buttons.confirm">确认</button>
            </form>
        </div>
    </div>

    <!-- AI Configuration Modal -->
    <div id="ai-config-modal" class="modal hidden">
        <div class="modal-content ai-config-modal-content">
            <span class="modal-close ai-config-close">&times;</span>
            <h3 data-i18n="ai.configTitle">AI配置</h3>
            <form id="ai-config-form" class="ai-config-form">
                <div class="form-group">
                    <label data-i18n="ai.provider">提供商:</label>
                    <select id="ai-provider" class="input-field">
                        <option value="openai">OpenAI</option>
                        <option value="anthropic">Anthropic</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="grok">Grok</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="ai.apiKey">API密钥:</label>
                    <div class="password-input-group">
                        <input type="password" id="ai-api-key" class="input-field" required>
                        <button type="button" class="btn-toggle-password" id="ai-toggle-key">👁️</button>
                    </div>
                </div>
                <div class="form-group" id="ai-endpoint-group" style="display: none;">
                    <label data-i18n="ai.endpoint">端点URL:</label>
                    <input type="url" id="ai-endpoint" class="input-field" placeholder="https://api.example.com/v1/chat/completions">
                </div>
                <div class="form-group">
                    <label data-i18n="ai.model">模型:</label>
                    <input type="text" id="ai-model" class="input-field" required>
                </div>
                <div class="form-group">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label data-i18n="ai.temperature" style="flex: 0 0 auto;">温度:</label>
                        <input type="range" id="ai-temperature" class="input-range" min="0" max="2" step="0.1" value="0.7" style="flex: 1;">
                        <span id="ai-temp-value" style="min-width: 40px; text-align: right; font-weight: bold; color: var(--primary-color);">0.7</span>
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="ai.maxTokens">最大Token数: <span style="color: #666; font-size: 0.9em;">(建议范围: 1000-32000)</span></label>
                    <input type="number" id="ai-max-tokens" class="input-field" min="1" value="2000">
                </div>
                <div class="form-group">
                    <label data-i18n="ai.historyLimit">历史记录限制:</label>
                    <input type="number" id="ai-history-limit" class="input-field" min="5" max="100" value="20">
                </div>
                <div class="ai-config-buttons">
                    <button type="button" class="btn btn-secondary" id="ai-test-connection" data-i18n="ai.testConnection">测试连接</button>
                    <button type="button" class="btn btn-secondary" id="ai-reset-config" data-i18n="ai.resetDefaults">重置默认</button>
                    <button type="button" class="btn btn-secondary" id="ai-clear-key" data-i18n="ai.clearKey">清除密钥</button>
                </div>
                <div class="ai-config-footer">
                    <button type="button" class="btn btn-secondary ai-config-cancel" data-i18n="buttons.cancel">取消</button>
                    <button type="submit" class="btn btn-primary" data-i18n="buttons.save">保存</button>
                </div>
            </form>
        </div>
    </div>
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modal-title" data-i18n="modal.newStory">新建故事</h3>
            <form id="modal-form">
                <input type="text" id="modal-input" class="input-field" data-i18n-placeholder="placeholder.inputName" placeholder="输入名称" required>
                <button type="submit" class="btn btn-primary" data-i18n="buttons.confirm">确认</button>
            </form>
        </div>
    </div>

    <script src="js/utils/constants.js"></script>
    <script src="js/utils/validators.js"></script>
    <script src="js/utils/formatters.js"></script>
    <script src="js/modules/I18nManager.js"></script>
    <script src="js/modules/FileManager.js"></script>
    <script src="js/modules/ContextBuilder.js"></script>
    <script src="js/modules/MemoryManager.js"></script>
    <script src="js/modules/PromptGenerator.js"></script>
    <script src="js/modules/HistoryManager.js"></script>
    <script src="js/state.js"></script>
    <!-- Managers -->
    <script src="js/managers/NotificationManager.js"></script>
    <script src="js/managers/ThemeManager.js"></script>
    <script src="js/managers/ModalManager.js"></script>
    <script src="js/managers/ExportImportManager.js"></script>
    <script src="js/managers/ViewManager.js"></script>
    <script src="js/managers/EventManager.js"></script>
    <script src="js/managers/UIRenderer.js"></script>
    <script src="js/managers/AIConfigManager.js"></script>
    <!-- AI Services -->
    <script src="js/services/AIService.js"></script>
    <!-- AI Modules -->
    <script src="js/modules/ParagraphAnalyzer.js"></script>
    <script src="js/modules/ParagraphStateSummary.js"></script>
    <!-- Models -->
    <script src="js/models/StoryElement.js"></script>
    <script src="js/models/StoryTimestamp.js"></script>
    <!-- Element/Event/State Components -->
    <script src="js/managers/ElementManager.js"></script>
    <script src="js/managers/StateTimeline.js"></script>
    <script src="js/managers/StoryViewManager.js"></script>
    <script src="js/managers/StateContextCache.js"></script>
    <script src="js/managers/AIElementTools.js"></script>
    <script src="js/managers/AIPreviewManager.js"></script>
    <!-- AI Manager (must be loaded after AIConfigManager and AIService) -->
    <script src="js/managers/AIManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
